<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="DKMerch - Your trusted source for authentic K-Pop merchandise">
  <!-- Mark PWA ASAP so loading splash paints first (no delayed logo-pop) -->
  <script>
    (function () {
      try {
        if (
          window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true
          || /source=pwa/i.test(window.location.search)
        ) {
          document.documentElement.classList.add('splash-pwa');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#fc1268">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DKMerch">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/images/pwa-icon-512.png?v=18">
  <link rel="apple-touch-icon" sizes="152x152" href="/images/pwa-icon-192.png?v=18">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/pwa-icon-512.png?v=18">
  <link rel="apple-touch-icon" sizes="167x167" href="/images/pwa-icon-512.png?v=18">

  <title>DKMerch | K-Pop Merchandise Store</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="/images/favicon-32.png?v=18" type="image/png" sizes="32x32">
  <link rel="icon" href="/images/favicon-48.png?v=18" type="image/png" sizes="48x48">
  <link rel="icon" href="/images/favicon-64.png?v=18" type="image/png" sizes="64x64">
  <link rel="shortcut icon" href="/images/favicon-64.png?v=18" type="image/png">


  <style>
    /* First paint = pink under splash only; app-ready restores white page bg */
    html, body {
      margin: 0;
      min-height: 100%;
      background: #fc1268;
    }
    html.app-ready,
    html.app-ready body,
    body.app-ready {
      background: #ffffff !important;
    }
    html.app-ready,
    body.app-ready {
      background: #ffffff !important;
    }
    #root:empty {
      min-height: 100vh;
      background: #fc1268;
    }
    html.app-ready #root,
    body.app-ready #root {
      background: #ffffff;
    }

    /* ── Splash Screen ── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 2147483646;
      background: linear-gradient(145deg, #fc1268 0%, #ff4d94 50%, #ff85b3 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Decorative circles background */
    #splash::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      top: -80px;
      right: -80px;
    }

    #splash::after {
      content: '';
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      bottom: -40px;
      left: -60px;
    }

    .splash-logo-wrap {
      position: relative;
      margin-bottom: 32px;
      animation: splashLogoPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* Installed PWA: logo/title appear instantly, but loading bar still crawls 0→100% */
    html.splash-pwa .splash-logo-wrap,
    html.splash-pwa .splash-title,
    html.splash-pwa .splash-sub,
    html.splash-pwa .splash-bar-wrap {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }

    @keyframes splashLogoPop {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .splash-logo {
      width: 110px;
      height: 110px;
      border-radius: 30px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 8px 32px rgba(0,0,0,0.18),
        0 0 0 1px rgba(255,255,255,0.55) inset;
      overflow: hidden;
    }

    .splash-logo img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      display: block;
    }

    .splash-logo-fallback {
      display: none;
      width: 80px;
      height: 80px;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #fc1268;
      letter-spacing: 0.5px;
    }

    /* Glow ring around logo */
    .splash-logo-glow {
      position: absolute;
      inset: -6px;
      border-radius: 34px;
      background: transparent;
      border: 2px solid rgba(255,255,255,0.3);
      animation: splashGlowPulse 1.8s ease-in-out infinite;
    }

    @keyframes splashGlowPulse {
      0%, 100% { transform: scale(1);    opacity: 0.6; }
      50%       { transform: scale(1.06); opacity: 1;   }
    }

    .splash-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
      margin: 0 0 6px;
      animation: splashFadeUp 0.28s ease 0.08s both;
    }

    .splash-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0 0 28px;
      animation: splashFadeUp 0.28s ease 0.12s both;
    }

    @keyframes splashFadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Loading bar — white fill crawls left → right (scaleX, not jump) */
    .splash-bar-wrap {
      width: 180px;
      height: 4px;
      background: rgba(255,255,255,0.25);
      border-radius: 99px;
      overflow: hidden;
      animation: splashFadeUp 0.28s ease 0.12s both;
    }

    .splash-bar {
      height: 100%;
      width: 100%;
      background: #ffffff;
      border-radius: 99px;
      box-shadow: 0 0 8px rgba(255,255,255,0.7);
      transform: scaleX(0);
      transform-origin: left center;
      will-change: transform;
      animation: splashBarCrawl 1.6s cubic-bezier(0.33, 0.1, 0.25, 1) 0.2s forwards;
    }

    html.splash-pwa .splash-bar {
      animation: splashBarCrawl 1.6s cubic-bezier(0.33, 0.1, 0.25, 1) 0.15s forwards;
    }

    @keyframes splashBarCrawl {
      0%   { transform: scaleX(0); }
      12%  { transform: scaleX(0.12); }
      28%  { transform: scaleX(0.28); }
      48%  { transform: scaleX(0.48); }
      68%  { transform: scaleX(0.7); }
      86%  { transform: scaleX(0.9); }
      100% { transform: scaleX(1); }
    }
  </style>
</head>
<body>

  <!-- ── Splash Screen ── -->
  <div id="splash">
    <div class="splash-logo-wrap">
      <div class="splash-logo">
        <img
          src="/images/dklogo2-removebg-preview.png"
          alt="DKMerch Logo"
          width="80"
          height="80"
          decoding="async"
          fetchpriority="high"
          onerror="this.style.display='none';var f=this.nextElementSibling;if(f){f.style.display='flex';}"
        />
        <div class="splash-logo-fallback" aria-hidden="true">DK</div>
      </div>
      <div class="splash-logo-glow"></div>
    </div>
    <div class="splash-title">DKMerch</div>
    <div class="splash-sub">K-Pop Paradise</div>
    <div class="splash-bar-wrap">
      <div class="splash-bar"></div>
    </div>
  </div>

  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <!-- Register Service Worker + Hide Splash -->
  <script>
    (function () {
      var isPwa = window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true
        || /source=pwa/i.test(window.location.search);
      if (isPwa) {
        try { document.documentElement.classList.add('splash-pwa'); } catch (e) {}
      }

      /* Keep splash up long enough to see the bar crawl 0→100% */
      var minShow = isPwa ? 1850 : 2000;
      var startTime = Date.now();
      var splashHidden = false;
      var bootReady = false;
      var rootReady = false;

      function markAppReady() {
        try {
          document.documentElement.classList.add('app-ready');
          document.body.classList.add('app-ready');
        } catch (e) { /* ignore */ }
      }

      function hideSplash() {
        if (splashHidden) return;
        // Wait for React boot so we don't flash a 2nd pink logo loader
        if (!bootReady && !window.__DKMERCH_BOOT__) return;
        splashHidden = true;
        var elapsed = Date.now() - startTime;
        var remaining = Math.max(0, minShow - elapsed);
        setTimeout(function () {
          markAppReady();
          var splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('hide');
            setTimeout(function () {
              if (splash.parentNode) splash.parentNode.removeChild(splash);
            }, 280);
          }
        }, remaining);
      }

      function tryHide() {
        if (bootReady || window.__DKMERCH_BOOT__) hideSplash();
      }

      window.addEventListener('dkmerch-boot', function () {
        bootReady = true;
        tryHide();
      });

      window.addEventListener('load', function () {
        var rootEl = document.getElementById('root');
        if (rootEl) {
          if (rootEl.children.length > 0) rootReady = true;
          else {
            var observer = new MutationObserver(function () {
              if (rootEl.children.length > 0) {
                rootReady = true;
                observer.disconnect();
                tryHide();
              }
            });
            observer.observe(rootEl, { childList: true });
          }
        }

        // If React already booted before this listener
        if (window.__DKMERCH_BOOT__) {
          bootReady = true;
          tryHide();
        }

        // Hard fallback — never stick on splash forever
        setTimeout(function () {
          bootReady = true;
          tryHide();
        }, 3500);

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js')
            .then(function (reg) { console.log('SW registered:', reg.scope); })
            .catch(function (err) { console.log('SW failed:', err); });
        }
      });
    })();
  </script>
</body>
</html>
